name: Refresh reports and deploy Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '7,22,37,52 * * * *'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      pages_type: ${{ steps.pages.outputs.build_type }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify implementation
        run: |
          for f in assets/js/*.js; do node --check "$f"; done
          for f in tools/*-test.mjs; do node "$f"; done
      - name: Scan sources and assemble static site
        run: |
          mkdir -p _site/docs
          cp *.html _site/
          cp -r assets _site/
          cp -r docs/* _site/docs/
          node tools/news-scan.mjs --out _site/docs/news-report.json
          touch _site/.nojekyll
          # Verify every HTML entry point exists in the built artifact
          for f in index.html delays.html game.html about.html 404.html; do
            test -f "_site/$f" || { echo "Missing _site/$f"; exit 1; }
          done
          echo "Pages artifact contains:"; ls _site/
          node -e 'const r=require("./_site/docs/news-report.json"); console.log(JSON.stringify({feedsOk:r.feedsOk,feedsFailed:r.feedsFailed,headlines:r.flagged.length})); if(r.feedsFailed) console.log("::warning::News scan has unavailable feeds; see the published snapshot.")'
      - name: Check Pages deployment mode
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mode=$(gh api "repos/$GITHUB_REPOSITORY/pages" --jq .build_type)
          if [ "$mode" != workflow ]; then
            # The workflow's narrowly scoped pages:write token may have access
            # even when the interactive GitHub integration cannot edit Pages.
            if gh api --method PUT "repos/$GITHUB_REPOSITORY/pages" -f build_type=workflow; then
              mode=workflow
            fi
          fi
          echo "build_type=$mode" >> "$GITHUB_OUTPUT"
          if [ "$mode" != workflow ]; then
            echo '::warning::Pages still uses branch publishing. A repository administrator must enable GitHub Actions as the Pages source. The report artifact is built but cannot be deployed automatically.'
          fi
      - uses: actions/configure-pages@v5
        if: steps.pages.outputs.build_type == 'workflow'
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    if: needs.build.outputs.pages_type == 'workflow'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
